    <!-- TRES VOCES, MAS EL WORDMARK.
         · Cormorant Garamond (400-700 + italic) — TODOS los titulares de la
           pagina. Es una serif de alto contraste que a tamano grande da el
           registro de revista, y su italic verdadera (no una oblicua
           sintetica) es lo que hace que una palabra en cursiva se lea como una
           decision y no como un efecto. Empezo siendo solo la voz de la
           galeria; el resto de la pagina se paso a ella porque una sola voz
           editorial ordena mas que dos compitiendo.
         · Jost (300-600) — cuerpo, bajadas, navegacion y botones. Geometrica
           de trazo uniforme: al lado de una Garamond de alto contraste no
           pelea por atencion, la acompana. Es la unica combinacion del sistema
           que hay que vigilar por tamano, porque tiene la x mas baja que la
           grotesca que reemplaza y por eso el cuerpo subio de 1.02 a 1.05rem.
         · DM Mono (400-500) — SOLO microcopys: "KM 86", "MALA, PERU",
           "3 CABANAS", contadores. Nunca parrafos.
         · Archivo variable (wdth 62-125) queda reservado al wordmark: el eje
           de ancho es lo que le permite llenar el viewport exacto en cualquier
           breakpoint y calzar con la mascara de oclusion de la foto del hero.
           Es el logotipo, no un titular, y por eso no se paso a la serif. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Mono:wght@400;500&family=Jost:wght@300..600&display=swap" rel="stylesheet" />
