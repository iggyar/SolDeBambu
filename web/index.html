    <!-- Archivo variable, con sus dos ejes. El de ancho (wdth 62-125) no es
         decoracion: permite que el wordmark del hero llene el viewport exacto en

         en wdth 62 hace de tipografia condensada para datos y precios.
         Una sola familia, tres voces. Inter para leer. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
